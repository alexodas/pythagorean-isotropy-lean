name: Build AI-disclosure manuscript PDF artifact

on:
  push:
    branches: [main]
    paths:
      - "manuscript/pythagorean_isotropy_ai_disclosure.tex"
      - ".github/workflows/build-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile PDF from LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/pythagorean_isotropy_ai_disclosure.tex

      - name: Put compiled PDF alongside the manuscript source
        run: |
          if test -s pythagorean_isotropy_ai_disclosure.pdf; then
            mv -f pythagorean_isotropy_ai_disclosure.pdf manuscript/
            echo "Replaced the previous manuscript with the newly built PDF."
          elif test -s manuscript/pythagorean_isotropy_ai_disclosure.pdf; then
            echo "The LaTeX action generated its output directly inside manuscript/."
          else
            echo "LaTeX reported success but the PDF was not found."
            find . -maxdepth 4 -name '*.pdf' -print
            exit 1
          fi

      - name: Check generated PDF
        run: |
          test -s manuscript/pythagorean_isotropy_ai_disclosure.pdf
          ls -lh manuscript/pythagorean_isotropy_ai_disclosure.pdf

      - name: Save reproducible manuscript PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pythagorean-isotropy-manuscript
          path: manuscript/pythagorean_isotropy_ai_disclosure.pdf
