name: Build and publish AI-disclosure manuscript PDF

on:
  push:
    branches: [main]
    paths:
      - "manuscript/pythagorean_isotropy_ai_disclosure.tex"
      - ".github/workflows/build-manuscript.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile PDF from LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/pythagorean_isotropy_ai_disclosure.tex

      - name: Put compiled PDF alongside the manuscript source
        run: |
          if test -s manuscript/pythagorean_isotropy_ai_disclosure.pdf; then
            echo "PDF is already in manuscript/."
          elif test -s pythagorean_isotropy_ai_disclosure.pdf; then
            mv pythagorean_isotropy_ai_disclosure.pdf manuscript/
          else
            echo "LaTeX reported success but the PDF was not found."
            find . -maxdepth 4 -name '*.pdf' -print
            exit 1
          fi

      - name: Check generated PDF
        run: |
          test -s manuscript/pythagorean_isotropy_ai_disclosure.pdf
          ls -lh manuscript/pythagorean_isotropy_ai_disclosure.pdf

      - name: Save reproducible manuscript PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pythagorean-isotropy-manuscript
          path: manuscript/pythagorean_isotropy_ai_disclosure.pdf

      - name: Commit generated PDF to the public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/pythagorean_isotropy_ai_disclosure.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
          else
            git commit -m "Publish AI-disclosure manuscript PDF"
            git push origin HEAD:main
          fi
