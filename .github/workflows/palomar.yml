
name: Lean and Comparator verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


on:
  push:
    branches: [palomar-preparation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with archived tag for preservation checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check preserved archive and statement signatures
        run: |
          python3 scripts/check-packaging.py
          python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Install Comparator sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare statements and replay through independent kernels
        run: bash scripts/verify-comparator.sh
